#
name: Create and publish a Docker image

# Configures this workflow to run every time a change is pushed to the branch called `release`.
on:
  push:
    branches: ["release/*", "main"]
  workflow_dispatch:

# Defines two custom environment variables for the workflow. These are used for the Container registry domain, and a name for the Docker image that this workflow builds.
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# There is a single job in this workflow. It's configured to run on the latest available version of Ubuntu.
jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    # Sets the permissions granted to the `GITHUB_TOKEN` for the actions in this job.
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
      #
    env:
      CHART_REPO: zemlab/golinks-helm
      IMAGE_REPO: zemlab/golinks
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # CRITICAL: Fetch full history for git describe to find the latest tag
          fetch-depth: 0
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Get Version Tag (x.y.z-gitshorthash)
        id: version
        run: |
          # 1. Get the most recent tag (excluding 'v' prefix) and append short hash (8-char)
          # --abbrev=8: Use 8-character short hash
          # --match '[0-9]*': Match tags that start with a number (e.g., 1.0.0), ignoring 'v'
          # sed 's/^v//': strip leading 'v' if tags use it
          FULL_DESCRIBE=$(git describe --tags --always --abbrev=8 --match 'v[0-9]*' | sed 's/^v//')

          # Get the 8-char short hash
          SHORT_HASH_8=${{ github.sha }}:0:8}

          # Default version is the full commit hash if no tag is found
          # Use the tag part if found, otherwise use the full short hash for a base
          TAG_BASE=$(echo $FULL_DESCRIBE | sed -E 's/(-[0-9]+-g[0-9a-f]{8})//')

          # If the tag base equals the full describe, we are ON a tag (e.g., 1.0.0)
          if [ "$TAG_BASE" == "$FULL_DESCRIBE" ]; then
              FINAL_VERSION="$TAG_BASE"
          else
              # We are NOT on a tag, so construct x.y.z-gitshorthash
              FINAL_VERSION="${TAG_BASE}-${SHORT_HASH_8}"
          fi

          # Output for subsequent steps
          echo "VERSION_TAG=${FINAL_VERSION}" >> $GITHUB_OUTPUT
          echo "DOCKER_TAGS=${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:${FINAL_VERSION}" >> $GITHUB_OUTPUT

          echo "Generated Version Tag: $FINAL_VERSION"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: ${{ steps.version.outputs.DOCKER_TAGS }}
          platforms: linux/amd64,linux/arm64
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0
      - name: Set Version
        id: chart_version
        working-directory: ./helm/
        run: |
          ## Update the 'version' field (this is often handled by 'helm set version' above, but good for backup)
          sed -i "s/^version: .*/version: ${{ steps.version.outputs.VERSION_TAG }}/" Chart.yaml

          # Update the 'appVersion' field
          sed -i "s/^appVersion: .*/appVersion: ${{ steps.version.outputs.VERSION_TAG }}/" Chart.yaml

          echo "Updated Chart.yaml version and appVersion to: ${{ steps.version.outputs.VERSION_TAG}}"

      - name: Package Chart
        working-directory: ./helm/
        run: helm package .

      - name: Push Chart to OCI Registry
        # The resulting chart tag will be based on the version in your Chart.yaml.
        # Example OCI path: ghcr.io/zemlab/golinks/chart:1.0.0
        working-directory: ./helm/
        run: |
          CHART_FILE=$(ls *.tgz)
          helm push $CHART_FILE oci://${{ env.REGISTRY }}/${{ env.CHART_REPO }}
